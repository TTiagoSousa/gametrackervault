org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true

# Versão da app Android (independente das versões do servidor: a interface vem
# sempre do servidor, por isso o APK só muda quando muda a própria app).
# O npm run build:android sobe-as sozinho em cada build (ver scripts/build-android.mjs):
# APP_VERSION_CODE é o que as apps instaladas comparam para oferecer a atualização.
APP_VERSION_NAME=1.1.0
APP_VERSION_CODE=2
