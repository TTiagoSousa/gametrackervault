org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true

# Android app version (independent of the server versions: the UI always comes
# from the server, so the APK only changes when the app itself changes).
# npm run build:android bumps them automatically on every build (see scripts/build-android.mjs):
# APP_VERSION_CODE is what installed apps compare to offer the update.
APP_VERSION_NAME=1.1.0
APP_VERSION_CODE=2
